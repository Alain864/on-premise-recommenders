[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "on-premise-recommenders"
version = "0.2.0"
description = "On-premise search and recommendation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "celery[redis]>=5.4.0",
  "elasticsearch>=8.0.0,<9.0.0",
  "fastapi>=0.135.1",
  "openai>=2.29.0",
  "pandas>=3.0.1",
  "pgvector>=0.4.0",
  "pyarrow>=23.0.1",
  "psycopg[binary]>=3.3.3",
  "pydantic-settings>=2.13.1",
  "python-dotenv>=1.2.2",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.48",
  "tenacity>=9.1.4",
  "typer>=0.24.1",
  "uvicorn[standard]>=0.42.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]

[project.scripts]
recommender = "onprem_recommenders.cli:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
